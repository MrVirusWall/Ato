<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Secaforte · ATO Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0d0f14;--surface:#161921;--surface2:#1e2330;--border:rgba(255,255,255,0.07);
  --saul:#e8b04a;--saul-dim:rgba(232,176,74,0.1);--saul-glow:rgba(232,176,74,0.25);
  --gabriel:#4ab8e8;--gabriel-dim:rgba(74,184,232,0.1);--gabriel-glow:rgba(74,184,232,0.25);
  --admin:#a78bfa;--admin-dim:rgba(167,139,250,0.1);--admin-glow:rgba(167,139,250,0.25);
  --green:#3dcc8a;--red:#e84a6a;--muted:rgba(255,255,255,0.35);--text:#f0f2f7;
  --fd:'Syne',sans-serif;--fb:'DM Sans',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:var(--fb);min-height:100vh;-webkit-text-size-adjust:100%;}

/* SCREENS */
.pin-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:32px;}
.pin-screen.hidden{display:none;}
.pin-logo{font-family:var(--fd);font-size:28px;font-weight:800;letter-spacing:4px;text-align:center;}
.pin-logo span{color:var(--muted);}
.pin-subtitle{font-size:13px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;text-align:center;margin-top:-20px;}
.pin-cards{display:flex;flex-direction:column;gap:12px;width:100%;max-width:320px;}
.ato-btn{padding:18px 20px;border-radius:14px;border:1.5px solid;background:transparent;cursor:pointer;display:flex;align-items:center;gap:14px;transition:all 0.2s;width:100%;}
.ato-btn.saul{border-color:var(--saul);color:var(--saul);}
.ato-btn.saul:active{background:var(--saul-dim);}
.ato-btn.gabriel{border-color:var(--gabriel);color:var(--gabriel);}
.ato-btn.gabriel:active{background:var(--gabriel-dim);}
.ato-btn.admin{border-color:var(--admin);color:var(--admin);}
.ato-btn.admin:active{background:var(--admin-dim);}
.ato-avatar{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-size:16px;font-weight:700;flex-shrink:0;}
.ato-btn.saul .ato-avatar{background:var(--saul-dim);}
.ato-btn.gabriel .ato-avatar{background:var(--gabriel-dim);}
.ato-btn.admin .ato-avatar{background:var(--admin-dim);}
.ato-info{text-align:left;}
.ato-name{font-family:var(--fd);font-size:18px;font-weight:700;letter-spacing:1px;}
.ato-role{font-size:12px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;}

/* MAIN APP */
#app{display:none;}
#app.vis{display:block;}
#adminApp{display:none;}
#adminApp.vis{display:block;}

/* HEADER */
.header{padding:14px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:0;z-index:50;}
.header-brand{font-family:var(--fd);font-size:16px;font-weight:800;letter-spacing:3px;}
.header-brand span{color:var(--muted);}
.hdr-right{display:flex;align-items:center;gap:8px;}
.user-pill{padding:5px 12px;border-radius:20px;border:1.5px solid;font-family:var(--fd);font-size:13px;font-weight:700;letter-spacing:1px;}
.user-pill.saul{border-color:var(--saul);color:var(--saul);}
.user-pill.gabriel{border-color:var(--gabriel);color:var(--gabriel);}
.user-pill.admin{border-color:var(--admin);color:var(--admin);}
.logout-btn{background:none;border:none;color:var(--muted);font-size:11px;letter-spacing:1px;cursor:pointer;text-transform:uppercase;padding:4px 8px;}

/* CONTENT */
.content{padding:16px;}

/* PERIOD TABS */
.period-tabs{display:flex;gap:0;background:var(--surface);border-radius:10px;border:1px solid var(--border);overflow:hidden;margin-bottom:16px;}
.ptab{flex:1;padding:10px 0;text-align:center;font-family:var(--fd);font-size:13px;font-weight:600;letter-spacing:1px;text-transform:uppercase;background:none;border:none;color:var(--muted);cursor:pointer;transition:all 0.15s;}
.ptab.active.saul{background:var(--saul-dim);color:var(--saul);}
.ptab.active.gabriel{background:var(--gabriel-dim);color:var(--gabriel);}
.ptab.active.admin{background:var(--admin-dim);color:var(--admin);}

/* SECTION LABEL */
.section-label{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);margin:20px 0 10px;}

/* KPI GRID */
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
.kpi-card{background:var(--surface);border-radius:12px;border:1px solid var(--border);padding:14px 14px 12px;}
.kpi-card.highlight-saul{border-color:var(--saul-glow);background:var(--saul-dim);}
.kpi-card.highlight-gabriel{border-color:var(--gabriel-glow);background:var(--gabriel-dim);}
.kpi-card.full-width{grid-column:1/-1;}
.kpi-label{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:6px;line-height:1.3;}
.kpi-value{font-family:var(--fd);font-size:28px;font-weight:800;line-height:1;}
.kpi-value.saul{color:var(--saul);}
.kpi-value.gabriel{color:var(--gabriel);}
.kpi-value.small{font-size:20px;}
.kpi-sub{font-size:11px;color:var(--muted);margin-top:4px;}

/* CONVERSION BAR */
.conv-bar{background:var(--surface);border-radius:12px;border:1px solid var(--border);padding:14px;margin-bottom:10px;}
.conv-header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;}
.conv-label{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);}
.conv-pct{font-family:var(--fd);font-size:22px;font-weight:800;}
.conv-pct.saul{color:var(--saul);}
.conv-pct.gabriel{color:var(--gabriel);}
.conv-track{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden;}
.conv-fill{height:100%;border-radius:3px;transition:width 0.5s ease;}
.conv-fill.saul{background:var(--saul);}
.conv-fill.gabriel{background:var(--gabriel);}

/* CANCELADAS */
.cancel-pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:20px;background:rgba(232,74,106,0.12);border:1px solid rgba(232,74,106,0.25);font-size:12px;font-weight:600;color:var(--red);}

/* LOADING */
.loading-bar{text-align:center;padding:40px 20px;color:var(--muted);font-size:13px;letter-spacing:2px;text-transform:uppercase;}
.loader-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--muted);animation:pulse 1.2s ease-in-out infinite;}
.loader-dot:nth-child(2){animation-delay:0.2s;}
.loader-dot:nth-child(3){animation-delay:0.4s;}
@keyframes pulse{0%,100%{opacity:0.2}50%{opacity:1}}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--surface2);border:1px solid var(--border);padding:10px 20px;border-radius:10px;font-size:13px;letter-spacing:1px;transition:transform 0.3s ease;z-index:100;white-space:nowrap;}
.toast.show{transform:translateX(-50%) translateY(0);}

/* REFRESH */
.refresh-row{text-align:center;padding:8px 0 20px;}
.refresh-btn{background:var(--surface);border:1px solid var(--border);color:var(--muted);padding:8px 20px;border-radius:8px;font-family:var(--fd);font-size:12px;letter-spacing:2px;cursor:pointer;text-transform:uppercase;}
.refresh-btn:active{opacity:0.7;}

/* SEMANA */
.semana-badge{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 12px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;}
.semana-txt{font-size:11px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;}
.semana-val{font-family:var(--fd);font-size:13px;font-weight:600;}

/* PIN */
.pin-dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--muted);transition:all 0.15s;}
.pin-dot.filled{background:var(--text);border-color:var(--text);}
.pin-dot.filled.saul{background:var(--saul);border-color:var(--saul);}
.pin-dot.filled.gabriel{background:var(--gabriel);border-color:var(--gabriel);}
.pin-dot.filled.admin{background:var(--admin);border-color:var(--admin);}
.pin-key{background:var(--surface);border:1px solid var(--border);color:var(--text);font-family:var(--fd);font-size:22px;font-weight:600;border-radius:12px;padding:16px;cursor:pointer;transition:all 0.1s;-webkit-tap-highlight-color:transparent;}
.pin-key:active{background:var(--surface2);transform:scale(0.95);}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.shake{animation:shake 0.35s ease;}

/* ADMIN - comparativo lado a lado */
.admin-content{padding:16px;}
.cmp-header{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:4px;padding:0 2px;}
.cmp-name{font-family:var(--fd);font-size:13px;font-weight:700;letter-spacing:2px;text-align:center;padding:8px;border-radius:8px;}
.cmp-name.saul{color:var(--saul);background:var(--saul-dim);}
.cmp-name.gabriel{color:var(--gabriel);background:var(--gabriel-dim);}
.cmp-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px;}
.cmp-cell{background:var(--surface);border-radius:12px;border:1px solid var(--border);padding:12px;}
.cmp-cell.win-saul{border-color:var(--saul-glow);}
.cmp-cell.win-gabriel{border-color:var(--gabriel-glow);}
.cmp-metric{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:4px;}
.cmp-val{font-family:var(--fd);font-size:22px;font-weight:800;}
.cmp-val.saul{color:var(--saul);}
.cmp-val.gabriel{color:var(--gabriel);}
.cmp-sub{font-size:10px;color:var(--muted);margin-top:3px;}
.cmp-divider{grid-column:1/-1;font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);padding:8px 0 4px;}

/* CHART */
.chart-wrap{background:var(--surface);border-radius:12px;border:1px solid var(--border);padding:14px;margin-bottom:16px;}
.chart-title{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:12px;}
canvas{width:100%!important;}
</style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
const SHEET_ID = '1PwYUmaX800n4H_kYGWlqleAbdS5h3bBivHswaAMem6Y';

const ATO_IDS = {
  saul:    ['US0005','saul','saúl'],
  gabriel: ['e8c0fd26','gabriel']
};

const ALL_PINS = { saul:'7285', gabriel:'4224', admin:'3993' };

let currentATO = null;
let currentTab = 'mes';
let adminTab = 'mes';
let DATA = { visitas:[], presupuestos:[] };
let pinBuffer = '';
let pendingKey = null;
let chartInstance = null;

// ─── PIN ───────────────────────────────────────────────
function startPin(key, name, initial) {
  pendingKey = { key, name, initial };
  pinBuffer = '';
  updatePinDots(key);
  document.getElementById('pinError').textContent = '';
  document.getElementById('pinSubtitle').textContent = name;
  document.getElementById('pinScreen').classList.add('hidden');
  document.getElementById('pinEntry').classList.remove('hidden');
}
function pinKey(d) {
  if (pinBuffer.length >= 4) return;
  pinBuffer += d;
  updatePinDots(pendingKey.key);
  if (pinBuffer.length === 4) setTimeout(checkPin, 120);
}
function pinBack() {
  pinBuffer = pinBuffer.slice(0,-1);
  updatePinDots(pendingKey.key);
}
function cancelPin() {
  pinBuffer = ''; pendingKey = null;
  document.getElementById('pinEntry').classList.add('hidden');
  document.getElementById('pinScreen').classList.remove('hidden');
}
function updatePinDots(key) {
  document.querySelectorAll('.pin-dot').forEach((d,i) => {
    d.className = 'pin-dot' + (i < pinBuffer.length ? ' filled ' + key : '');
  });
}
function checkPin() {
  if (pinBuffer === ALL_PINS[pendingKey.key]) {
    document.getElementById('pinEntry').classList.add('hidden');
    if (pendingKey.key === 'admin') {
      enterAdmin();
    } else {
      enterATO(pendingKey.key, pendingKey.name, pendingKey.initial);
    }
  } else {
    const dots = document.getElementById('pinDots');
    dots.classList.add('shake');
    setTimeout(() => dots.classList.remove('shake'), 400);
    document.getElementById('pinError').textContent = 'PIN incorrecto';
    pinBuffer = '';
    updatePinDots(pendingKey.key);
  }
}

// ─── ATO ───────────────────────────────────────────────
function enterATO(key, name, initial) {
  currentATO = { key, name, initial };
  document.getElementById('app').style.display = 'block';
  document.getElementById('userPill').textContent = name;
  document.getElementById('userPill').className = 'user-pill ' + key;
  document.getElementById('tabMes').className = 'ptab active ' + key;
  document.getElementById('tabSem').className = 'ptab ' + key;
  loadData();
}

function logout() {
  currentATO = null; pinBuffer = ''; pendingKey = null;
  document.getElementById('app').style.display = 'none';
  document.getElementById('adminApp').style.display = 'none';
  document.getElementById('pinScreen').classList.remove('hidden');
  if (chartInstance) { chartInstance.destroy(); chartInstance = null; }
}

function setTab(tab) {
  currentTab = tab;
  const k = currentATO.key;
  document.getElementById('tabMes').className = 'ptab' + (tab==='mes'?' active '+k:' '+k);
  document.getElementById('tabSem').className = 'ptab' + (tab==='sem'?' active '+k:' '+k);

}

// ─── ADMIN ─────────────────────────────────────────────
function enterAdmin() {
  document.getElementById('adminApp').style.display = 'block';
  document.getElementById('adminTabMes').className = 'ptab active admin';
  document.getElementById('adminTabSem').className = 'ptab admin';
  loadAdminData();

function setAdminTab(tab) {
  adminTab = tab;
  document.getElementById('adminTabMes').className = 'ptab' + (tab==='mes'?' active admin':' admin');
  document.getElementById('adminTabSem').className = 'ptab' + (tab==='sem'?' active admin':' admin');

async function loadAdminData() {
  document.getElementById('adminContent').innerHTML = '<div class="loading-bar"><span class="loader-dot"></span><span class="loader-dot"></span><span class="loader-dot"></span></div>';
  try {
    const [vis, pres] = await Promise.all([
      fetchSheet('Visitas'),
      fetchSheet('presupuestoProspecto')
    ]);
    DATA.visitas = vis;
    DATA.presupuestos = pres;

  } catch(e) {
    document.getElementById('adminContent').innerHTML = '<div class="loading-bar" style="color:#e84a6a">Error al cargar datos.</div>';
  }
}

function reloadAdminData() { loadAdminData(); showToast('Actualizando...'); }

// ─── DATE HELPERS ──────────────────────────────────────
function parseGVizDate(v) {
  if (!v) return null;
  const s = String(v).trim();
  const m1 = s.match(/Date\((\d+),(\d+),(\d+)/);
  if (m1) return new Date(+m1[1], +m1[2], +m1[3]);
  const m2 = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if (m2) return new Date(+m2[3], +m2[2]-1, +m2[1]);
  const m3 = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m3) return new Date(+m3[1], +m3[2]-1, +m3[3]);
  const d = new Date(v); return isNaN(d)?null:d;
}
function getMesActual() { const n=new Date(); return {y:n.getFullYear(),m:n.getMonth()}; }
function inMes(dv) {
  const d=parseGVizDate(dv); if(!d) return false;
  const {y,m}=getMesActual();
  return d.getFullYear()===y && d.getMonth()===m;
}
function getSemanas() {
  const now=new Date(), y=now.getFullYear(), m=now.getMonth();
  const dim=new Date(y,m+1,0).getDate(), weeks=[];
  let day=1;
  while(day<=dim){ const s=day,e=Math.min(day+6,dim); weeks.push({start:new Date(y,m,s),end:new Date(y,m,e)}); day=e+1; }
  return weeks;
}
function getCurrentWeekIdx() {
  const now=new Date(), weeks=getSemanas();
  for(let i=0;i<weeks.length;i++){
    if(now>=weeks[i].start && now<=new Date(weeks[i].end.getFullYear(),weeks[i].end.getMonth(),weeks[i].end.getDate(),23,59,59)) return i;
  }
  return weeks.length-1;
}
function inSemana(dv) {
  const d=parseGVizDate(dv); if(!d) return false;
  const weeks=getSemanas(), idx=getCurrentWeekIdx();
  const {start,end}=weeks[idx];
  return d>=start && d<=new Date(end.getFullYear(),end.getMonth(),end.getDate(),23,59,59);
}
function getSemanaLabel() {
  const weeks=getSemanas(), idx=getCurrentWeekIdx(), w=weeks[idx];
  const f=d=>d.getDate()+'/'+(d.getMonth()+1);
  return 'Semana '+(idx+1)+': '+f(w.start)+' — '+f(w.end);
}

// ─── ATO MATCH ────────────────────────────────────────
function matchATO(val, key) {
  if(!val) return false;
  const v=String(val).toLowerCase().trim();
  return ATO_IDS[key].some(id=>v===id.toLowerCase()||v.includes(id.toLowerCase()));
}
function isMyATO(val) { return matchATO(val, currentATO.key); }

// ─── FETCH ────────────────────────────────────────────
async function fetchSheet(sheetName) {
  const url=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(sheetName)}`;
  const res=await fetch(url), txt=await res.text();
  const json=JSON.parse(txt.substring(47).slice(0,-2));
  if(!json.table||!json.table.rows) return [];
  const cols=json.table.cols.map(c=>c.label||c.id||'');
  return json.table.rows.map(row=>{
    const obj={};
    row.c.forEach((cell,i)=>{ obj[cols[i]]=cell?(cell.v!==undefined?cell.v:cell.f):null; });
    return obj;
  });
}

// ─── ATO LOAD & RENDER ────────────────────────────────
async function loadData() {
  document.getElementById('mainContent').innerHTML='<div class="loading-bar"><span class="loader-dot"></span><span class="loader-dot"></span><span class="loader-dot"></span></div>';
  try {
    const [vis,pres]=await Promise.all([fetchSheet('Visitas'),fetchSheet('presupuestoProspecto')]);
    DATA.visitas=vis; DATA.presupuestos=pres; render();
  } catch(e) {
    document.getElementById('mainContent').innerHTML='<div class="loading-bar" style="color:#e84a6a">Error al cargar datos.</div>';
  }
}
function reloadData() { loadData(); showToast('Actualizando...'); }

function calcATO(key, inPeriod) {
  const esPresup=v=>{ const m=String(v['Motivo_Visita']||'').toLowerCase(); return m==='presupuesto'||m.includes('presup'); };
  const esCobr=v=>{ const m=String(v['Motivo_Visita']||'').toLowerCase(); return m==='cobranza'||m.includes('cobr'); };
  const visPeriodo=DATA.visitas.filter(v=>inPeriod(v['FechaHora_Visita']));
  const visPresup=visPeriodo.filter(v=>String(v['Estado_Visita']||'')==='Realizada'&&esPresup(v)&&matchATO(v['Asesor_Visita'],key));
  const visCobr=visPeriodo.filter(v=>String(v['Estado_Visita']||'')==='Realizada'&&esCobr(v)&&matchATO(v['Asesor_Visita'],key));
  const visCobrPend=visPeriodo.filter(v=>String(v['Estado_Visita']||'')==='Pendiente'&&esCobr(v)&&matchATO(v['Asesor_Visita'],key));
  const pres=DATA.presupuestos.filter(p=>matchATO(p['Asesor_Presupuesto'],key)&&inPeriod(p['Fecha_Presupuesto']));
  const ventas=DATA.presupuestos.filter(p=>matchATO(p['Asesor_Presupuesto'],key)&&String(p['Estado_Presupuesto']||'')==='Vendido'&&inPeriod(p['Fecha_Venta']));
  const montoVendido=ventas.reduce((s,p)=>s+(parseFloat(p['SubTotal_Presupuesto'])||0),0);
  const efectividad=pres.length>0?(ventas.length/pres.length*100):0;
  const promPres=pres.length>0?pres.reduce((s,p)=>s+(parseFloat(p['SubTotal_Presupuesto'])||0),0)/pres.length:0;
  const promVenta=ventas.length>0?montoVendido/ventas.length:0;
  const visTotales=visPeriodo.filter(v=>matchATO(v['Asesor_Visita'],key));
  const visCanceladas=visTotales.filter(v=>String(v['Estado_Visita']||'')==='Cancelada');
  const pctCanceladas=visTotales.length>0?(visCanceladas.length/visTotales.length*100):0;
  const visPresupAsig=visPeriodo.filter(v=>esPresup(v)&&matchATO(v['Asesor_Visita'],key));
  const visPresupCanc=visPresupAsig.filter(v=>String(v['Estado_Visita']||'')==='Cancelada');
  const pctPresupCanc=visPresupAsig.length>0?(visPresupCanc.length/visPresupAsig.length*100):0;
  return {visPresup:visPresup.length,visCobr:visCobr.length,visCobrPend:visCobrPend.length,
    pres:pres.length,ventas:ventas.length,montoVendido,efectividad,promPres,promVenta,
    pctCanceladas,visCanceladas:visCanceladas.length,visTotales:visTotales.length,
    visPresupAsig:visPresupAsig.length,visPresupCanc:visPresupCanc.length,pctPresupCanc};
}

function render() {
  const k=currentATO.key;
  const inPeriod=currentTab==='mes'?inMes:inSemana;
  const c=calcATO(k,inPeriod);
  document.getElementById('semBadgeVal').textContent=getSemanaLabel();
  const fmt=n=>Math.round(n).toLocaleString('es-BO');
  const fd=n=>n.toFixed(1);
  document.getElementById('mainContent').innerHTML=`
    <div class="section-label">Ventas</div>
    <div class="kpi-grid">
      <div class="kpi-card highlight-${k} full-width">
        <div class="kpi-label">Monto Vendido</div>
        <div class="kpi-value ${k}">Bs ${fmt(c.montoVendido)}</div>
        <div class="kpi-sub">${c.ventas} venta${c.ventas!==1?'s':''} cerrada${c.ventas!==1?'s':''}</div>
      </div>
      <div class="kpi-card"><div class="kpi-label">Promedio Venta</div><div class="kpi-value ${k} small">Bs ${fmt(c.promVenta)}</div></div>
      <div class="kpi-card"><div class="kpi-label">Promedio Presup.</div><div class="kpi-value ${k} small">Bs ${fmt(c.promPres)}</div></div>
    </div>
    <div class="section-label">Actividad</div>
    <div class="kpi-grid">
      <div class="kpi-card"><div class="kpi-label">Presupuestos Hechos</div><div class="kpi-value ${k}">${c.pres}</div></div>
      <div class="kpi-card"><div class="kpi-label">Visitas Presup. Realizadas</div><div class="kpi-value ${k}">${c.visPresup}</div></div>
      <div class="kpi-card full-width">
        <div class="kpi-label">Visitas Cobranza</div>
        <div style="display:flex;align-items:baseline;gap:16px;margin-top:4px">
          <div><div class="kpi-value ${k}">${c.visCobr}</div><div class="kpi-sub">realizadas</div></div>
          <div style="width:1px;height:36px;background:var(--border);align-self:center"></div>
          <div><div class="kpi-value" style="font-size:22px;color:var(--muted)">${c.visCobrPend}</div><div class="kpi-sub">pendientes</div></div>
        </div>
      </div>
    </div>
    <div class="section-label">Efectividad</div>
    <div class="conv-bar">
      <div class="conv-header"><span class="conv-label">Tasa de cierre</span><span class="conv-pct ${k}">${fd(c.efectividad)}%</span></div>
      <div class="conv-track"><div class="conv-fill ${k}" style="width:${Math.min(c.efectividad,100)}%"></div></div>
      <div style="font-size:11px;color:var(--muted);margin-top:6px">${c.ventas} vendido${c.ventas!==1?'s':''} de ${c.pres} presupuesto${c.pres!==1?'s':''}</div>
    </div>
    <div class="section-label">Visitas Canceladas</div>
    <div class="kpi-card" style="margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <div class="kpi-label" style="margin:0">Total asignadas al ATO</div>
        <span class="cancel-pill">${fd(c.pctCanceladas)}% cancelado</span>
      </div>
      <div style="font-size:12px;color:var(--muted)">${c.visCanceladas} canceladas de ${c.visTotales} asignadas</div>
      ${c.visPresupAsig>0?`<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border)">
        <div style="font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:4px">Solo visitas de presupuesto</div>
        <div style="font-size:12px;color:var(--muted)">${c.visPresupCanc} canceladas de ${c.visPresupAsig} → <span style="color:var(--red);font-weight:600">${fd(c.pctPresupCanc)}%</span></div>
      </div>`:''}
    </div>
  `;
}

// ─── ADMIN RENDER ─────────────────────────────────────
function renderAdmin() {
  const inPeriod = adminTab==='mes'?inMes:inSemana;
  const s = calcATO('saul', inPeriod);
  const g = calcATO('gabriel', inPeriod);
  const fmt = n => Math.round(n).toLocaleString('es-BO');
  const fd = n => n.toFixed(1);

  // Helper: quién gana (mayor = mejor, excepto canceladas donde menor = mejor)
  const winClass = (sv,gv,inverse=false) => {
    if(sv===gv) return ['',''];
    const sWins = inverse ? sv<gv : sv>gv;
    return sWins ? ['win-saul',''] : ['','win-gabriel'];
  };

  const [ws1,wg1]=winClass(s.montoVendido,g.montoVendido);
  const [ws2,wg2]=winClass(s.pres,g.pres);
  const [ws3,wg3]=winClass(s.visPresup,g.visPresup);
  const [ws4,wg4]=winClass(s.visCobr,g.visCobr);
  const [ws5,wg5]=winClass(s.efectividad,g.efectividad);
  const [ws6,wg6]=winClass(s.promVenta,g.promVenta);
  const [ws7,wg7]=winClass(s.promPres,g.promPres);
  const [ws8,wg8]=winClass(s.pctCanceladas,g.pctCanceladas,true);

  document.getElementById('adminContent').innerHTML=`
    <div class="cmp-header">
      <div class="cmp-name saul">SAÚL</div>
      <div class="cmp-name gabriel">GABRIEL</div>
    </div>

    <div class="cmp-row">
      <div class="cmp-cell ${ws1}"><div class="cmp-metric">Monto Vendido</div><div class="cmp-val saul" style="font-size:18px">Bs ${fmt(s.montoVendido)}</div><div class="cmp-sub">${s.ventas} venta${s.ventas!==1?'s':''}</div></div>
      <div class="cmp-cell ${wg1}"><div class="cmp-metric">Monto Vendido</div><div class="cmp-val gabriel" style="font-size:18px">Bs ${fmt(g.montoVendido)}</div><div class="cmp-sub">${g.ventas} venta${g.ventas!==1?'s':''}</div></div>
    </div>

    <div class="cmp-row">
      <div class="cmp-cell ${ws2}"><div class="cmp-metric">Presupuestos</div><div class="cmp-val saul">${s.pres}</div></div>
      <div class="cmp-cell ${wg2}"><div class="cmp-metric">Presupuestos</div><div class="cmp-val gabriel">${g.pres}</div></div>
    </div>

    <div class="cmp-row">
      <div class="cmp-cell ${ws3}"><div class="cmp-metric">Visitas Presup.</div><div class="cmp-val saul">${s.visPresup}</div></div>
      <div class="cmp-cell ${wg3}"><div class="cmp-metric">Visitas Presup.</div><div class="cmp-val gabriel">${g.visPresup}</div></div>
    </div>

    <div class="cmp-row">
      <div class="cmp-cell ${ws4}"><div class="cmp-metric">Cobranza</div><div class="cmp-val saul">${s.visCobr}</div><div class="cmp-sub">${s.visCobrPend} pendientes</div></div>
      <div class="cmp-cell ${wg4}"><div class="cmp-metric">Cobranza</div><div class="cmp-val gabriel">${g.visCobr}</div><div class="cmp-sub">${g.visCobrPend} pendientes</div></div>
    </div>

    <div class="cmp-row">
      <div class="cmp-cell ${ws5}"><div class="cmp-metric">Efectividad</div><div class="cmp-val saul">${fd(s.efectividad)}%</div><div class="cmp-sub">${s.ventas}/${s.pres}</div></div>
      <div class="cmp-cell ${wg5}"><div class="cmp-metric">Efectividad</div><div class="cmp-val gabriel">${fd(g.efectividad)}%</div><div class="cmp-sub">${g.ventas}/${g.pres}</div></div>
    </div>

    <div class="cmp-row">
      <div class="cmp-cell ${ws6}"><div class="cmp-metric">Prom. Venta</div><div class="cmp-val saul" style="font-size:18px">Bs ${fmt(s.promVenta)}</div></div>
      <div class="cmp-cell ${wg6}"><div class="cmp-metric">Prom. Venta</div><div class="cmp-val gabriel" style="font-size:18px">Bs ${fmt(g.promVenta)}</div></div>
    </div>

    <div class="cmp-row">
      <div class="cmp-cell ${ws7}"><div class="cmp-metric">Prom. Presup.</div><div class="cmp-val saul" style="font-size:18px">Bs ${fmt(s.promPres)}</div></div>
      <div class="cmp-cell ${wg7}"><div class="cmp-metric">Prom. Presup.</div><div class="cmp-val gabriel" style="font-size:18px">Bs ${fmt(g.promPres)}</div></div>
    </div>

    <div class="cmp-row">
      <div class="cmp-cell ${ws8}"><div class="cmp-metric">% Canceladas</div><div class="cmp-val saul" style="color:${s.pctCanceladas>30?'var(--red)':'var(--saul)'}">${fd(s.pctCanceladas)}%</div><div class="cmp-sub">${s.visCanceladas}/${s.visTotales}</div></div>
      <div class="cmp-cell ${wg8}"><div class="cmp-metric">% Canceladas</div><div class="cmp-val gabriel" style="color:${g.pctCanceladas>30?'var(--red)':'var(--gabriel)'}">${fd(g.pctCanceladas)}%</div><div class="cmp-sub">${g.visCanceladas}/${g.visTotales}</div></div>
    </div>

    <div class="section-label" style="margin-top:24px">Visitas diarias del mes — Saúl + Gabriel</div>
    <div class="chart-wrap">
      <canvas id="chartVisitas" height="200"></canvas>
    </div>
  `;

  // Build daily visits chart for whole current month (both ATOs combined)
  buildDailyChart();
}

function buildDailyChart() {
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth();
  const dim = new Date(y,m+1,0).getDate();
  const labels = [], saulData = [], gabrielData = [];

  for(let d=1;d<=dim;d++) {
    const day = new Date(y,m,d);
    const dayEnd = new Date(y,m,d,23,59,59);
    labels.push(d+'/'+(m+1));
    const countForKey = (key) => DATA.visitas.filter(v => {
      const vd = parseGVizDate(v['FechaHora_Visita']);
      return vd && vd>=day && vd<=dayEnd && matchATO(v['Asesor_Visita'],key);
    }).length;
    saulData.push(countForKey('saul'));
    gabrielData.push(countForKey('gabriel'));
  }

  if(chartInstance) { chartInstance.destroy(); chartInstance=null; }
  const ctx = document.getElementById('chartVisitas').getContext('2d');
  chartInstance = new Chart(ctx, {
    type:'line',
    data:{
      labels,
      datasets:[
        {
          label:'Saúl',
          data:saulData,
          borderColor:'#e8b04a',
          backgroundColor:'rgba(232,176,74,0.08)',
          pointBackgroundColor:'#e8b04a',
          pointRadius:3,
          tension:0.3,
          fill:true
        },
        {
          label:'Gabriel',
          data:gabrielData,
          borderColor:'#4ab8e8',
          backgroundColor:'rgba(74,184,232,0.08)',
          pointBackgroundColor:'#4ab8e8',
          pointRadius:3,
          tension:0.3,
          fill:true
        }
      ]
    },
    options:{
      responsive:true,
      interaction:{mode:'index',intersect:false},
      plugins:{
        legend:{labels:{color:'rgba(255,255,255,0.5)',font:{size:11},boxWidth:12}},
        tooltip:{backgroundColor:'#1e2330',borderColor:'rgba(255,255,255,0.07)',borderWidth:1,titleColor:'#f0f2f7',bodyColor:'rgba(255,255,255,0.7)'}
      },
      scales:{
        x:{ticks:{color:'rgba(255,255,255,0.3)',font:{size:9},maxTicksLimit:16},grid:{color:'rgba(255,255,255,0.04)'}},
        y:{ticks:{color:'rgba(255,255,255,0.3)',font:{size:10},stepSize:1},grid:{color:'rgba(255,255,255,0.04)'},beginAtZero:true}
      }
    }
  });
}

function showToast(msg) {
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}
</script>
